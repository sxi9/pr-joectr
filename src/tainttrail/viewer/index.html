<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The server sends the same policy as a header, which also covers the worker. This copy
       protects a static copy on a host that sends no headers. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="TaintTrail viewer: replays an agent session graph in the browser on Relate's WebAssembly build. Offline; nothing leaves this machine.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M5 6.5h6.5a3.5 3.5 0 0 1 0 7H10a3.5 3.5 0 0 0 0 7h9' fill='none' stroke='%237f899c' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='5' cy='6.5' r='2.6' fill='%23a61e8a'/%3E%3Ccircle cx='19' cy='20.5' r='2.6' fill='%23d97706'/%3E%3C/svg%3E">
  <title>TaintTrail viewer</title>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body data-state="loading">
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="TaintTrail, overview">
      <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <path class="brand-trail" d="M5 6.5h6.5a3.5 3.5 0 0 1 0 7H10a3.5 3.5 0 0 0 0 7h9" fill="none" stroke-width="2" stroke-linecap="round"/>
        <circle class="brand-dot-a" cx="5" cy="6.5" r="2.6"/>
        <circle class="brand-dot-b" cx="19" cy="20.5" r="2.6"/>
      </svg>
      <span class="brand-name">TaintTrail</span>
    </a>
    <span class="project" id="project" hidden></span>
    <nav class="tabs" id="tabs" aria-label="Views">
      <a href="#/" data-tab="overview">Overview</a>
      <a href="#/session" data-tab="session">Timeline</a>
      <a href="#/findings" data-tab="findings" aria-label="Attack paths"><span class="tab-long">Attack paths</span><span class="tab-short">Paths</span></a>
      <a href="#/map" data-tab="map" aria-label="Capability map"><span class="tab-long">Capability map</span><span class="tab-short">Map</span></a>
      <a href="#/console" data-tab="console">Console</a>
    </nav>
    <div class="topbar-actions">
      <button type="button" class="btn btn-quiet" id="open-file" title="Open an export file (.json)">Open file</button>
      <button type="button" class="btn btn-quiet btn-icon" id="theme-toggle" aria-pressed="false" title="Switch between light and dark">
        <span class="visually-hidden" id="theme-label">Switch to dark theme</span>
        <svg class="icon-sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.2v1.7M8 13.1v1.7M1.2 8h1.7M13.1 8h1.7M3.2 3.2l1.2 1.2M11.6 11.6l1.2 1.2M12.8 3.2l-1.2 1.2M4.4 11.6l-1.2 1.2" fill="none" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M13.6 9.9A6 6 0 0 1 6.1 2.4a6 6 0 1 0 7.5 7.5z"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <section class="boot" id="boot" aria-live="polite">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-title" id="boot-title">Starting Relate in this tab</p>
      <p class="boot-detail" id="boot-detail">Loading the WebAssembly engine. Nothing leaves this machine.</p>
    </section>
  </main>

  <footer class="statusbar" id="statusbar" aria-label="Graph engine status">
    <span class="status-item status-engine"><span class="status-dot" id="status-dot" aria-hidden="true"></span><span id="status-engine">Relate WASM: starting</span></span>
    <span class="status-item" id="status-graph" hidden></span>
    <span class="status-item" id="status-query" hidden></span>
    <span class="status-spacer"></span>
    <span class="status-item status-source" id="status-source" hidden></span>
  </footer>

  <input type="file" id="file-input" accept=".json,application/json" hidden>
  <div class="drop-veil" id="drop-veil" hidden><div class="drop-veil-box">Drop a TaintTrail export to open it</div></div>
  <noscript><p class="noscript">The TaintTrail viewer runs a graph database in your browser and needs JavaScript.</p></noscript>
</body>
</html>
