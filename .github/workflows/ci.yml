name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Replay every packaged scenario through the hook adapter
        run: tainttrail demo all
      - name: The committed Relate store opens and the stored rule query still finds the path
        run: TAINTTRAIL_DB=examples/claude-code-session/graph.rl tainttrail explain TT001
